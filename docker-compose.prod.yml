  iii:
    image: debian:stable-slim
    container_name: zoo-compose-iii
    # profiles: [ "standalone-iii" ]
    working_dir: /engine
    entrypoint: [ "/root/.local/bin/iii" ]
    environment:
      HOME: /root
    volumes:
      - ./iii:/engine
      - ${III_BIN_DIR:-/home/ubuntu/.local/bin}:/root/.local/bin:ro
      - iii_home:/root/.iii
    ports:
      - "${III_HOST_PORT:-49134}:49134"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoo-compose-backend
