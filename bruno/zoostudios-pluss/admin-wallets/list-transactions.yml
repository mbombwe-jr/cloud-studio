info:
  name: list-transactions
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/accounts/{{accountId}}/wallets/COLLECTION/transactions?page=1&limit=20"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN + SERVICEMAN. Wallet ledger entries. Replace COLLECTION with
  DISBURSEMENT as needed.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
