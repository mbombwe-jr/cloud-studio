info:
  name: get-fees
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/admin/accounts/{{accountId}}/fees"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN + SERVICEMAN. Per-customer fee schedule in basis points
  (defaults: 5% below 3000 TZS, 2% at/above, transfers 2%).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
