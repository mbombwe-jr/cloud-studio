info:
  name: create-settlement
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/accounts/{{accountId}}/settlement"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  body:
    type: json
    data: |-
      {
        "type": "BANK",
        "bankName": "CRDB Bank",
        "bankInitials": "CRDB",
        "accountNumber": "0676544740",
        "accountName": "ACME LTD"
      }
  auth: inherit

docs: |
  ADMIN. Add a settlement account. For MOBILE use: type MOBILE with
  method AIRTEL/TIGO/VODACOM/HALOPESA and a Tanzanian phoneNumber.
  The new row becomes the default.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
