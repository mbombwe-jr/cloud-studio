http:
  method: GET
  url: "{{baseUrl}}/disbursements/{{payoutReference}}"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  One payout by 20-char reference (works for batch members too).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
