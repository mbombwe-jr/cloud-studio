info:
  name: profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  The account's own profile: identity, granted services, wallets and
  current plan. Auth: X-API-Key (>= 32 chars).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
