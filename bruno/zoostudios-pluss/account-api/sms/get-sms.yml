info:
  name: get-sms
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/sms/{{smsReference}}"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  One message by 20-char reference, including computed cost and
  provider status.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
