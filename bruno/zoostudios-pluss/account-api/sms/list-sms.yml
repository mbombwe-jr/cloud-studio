info:
  name: list-sms
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/sms?page=1&limit=20"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  Full SMS history. Optional &status=QUEUED|SENT|DELIVERED|FAILED.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
