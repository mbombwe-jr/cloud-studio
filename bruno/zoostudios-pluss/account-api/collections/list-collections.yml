info:
  name: list-collections
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/collections?page=1&limit=20"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  Collections of this account. Optional &status=PENDING|SUCCESSFUL|FAILED|CANCELLED|TIMEOUT.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
