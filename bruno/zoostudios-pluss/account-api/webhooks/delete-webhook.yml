http:
  method: DELETE
  url: "{{baseUrl}}/me/webhooks/{{webhookEndpointId}}"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  Removes a webhook endpoint. Delivery retries stop immediately.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
