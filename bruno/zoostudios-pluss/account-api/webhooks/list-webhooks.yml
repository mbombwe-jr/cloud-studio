info:
  name: list-webhooks
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/me/webhooks"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  Lists the account's registered webhook endpoints (secrets never
  shown again).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
