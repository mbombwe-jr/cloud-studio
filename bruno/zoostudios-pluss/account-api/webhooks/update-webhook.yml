info:
  name: update-webhook
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/me/webhooks/{{webhookEndpointId}}"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  body:
    type: json
    data: |-
      {
        "url": "https://webhook.site/updated-id",
        "events": ["COLLECTION_STATUS", "DISBURSEMENT_STATUS"]
      }
  auth: inherit

docs: |
  Updates the target URL and/or subscribed events of an endpoint.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
