info:
  name: settlement-accounts
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/wallets/settlement-accounts"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      enabled: true
  auth: inherit

docs: |
  The account's settlement accounts (mobile: method + phone; bank:
  number + bank name + initials).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
