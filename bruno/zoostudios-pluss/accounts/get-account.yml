http:
  method: GET
  url: "{{baseUrl}}/admin/accounts/{{accountId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN + SERVICEMAN. Full account record by public id.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
