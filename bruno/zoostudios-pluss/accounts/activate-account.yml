info:
  name: activate-account
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/admin/accounts/{{accountId}}/activate"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN only. Reactivates a manually suspended account.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
