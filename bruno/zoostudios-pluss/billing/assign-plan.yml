info:
  name: assign-plan
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/admin/accounts/{{accountId}}/plan"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  body:
    type: json
    data: |-
      {
        "planId": "{{planId}}"
      }
  auth: inherit

docs: |
  ADMIN only. Assigns a plan to an account (SUBSCRIPTION mode).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
