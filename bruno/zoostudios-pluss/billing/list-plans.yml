info:
  name: list-plans
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/plans"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN + SERVICEMAN. Lists all plans (includes the seeded Starter TZ).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
