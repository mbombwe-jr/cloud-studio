info:
  name: traces
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/admin/traces?page=1&limit=20"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN + SERVICEMAN. Distributed trace inspection with full span
  snapshots. Optional &traceId=, &reference=(20-char ref),
  &component=collections|disbursements|sms|webhooks|clickpesa|beem

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
