info:
  name: account-overview
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/accounts/{{accountId}}/overview?page=1&limit=20"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
      enabled: true
  auth: inherit

docs: |
  ADMIN + SERVICEMAN. Full data preview for one account: identity,
  permissions, wallets, recent transactions and SMS.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
